<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Light Controller - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .signup-header .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .signup-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            background: #fadbd8;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #27ae60;
            background: #d5f4e6;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #27ae60;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .login-link p {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .password-requirement {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
            padding: 8px 10px;
            background: #f0f0f0;
            border-radius: 4px;
            display: none;
        }

        .password-requirement.show {
            display: block;
        }

        .requirement-item {
            margin: 4px 0;
        }

        .requirement-item.valid {
            color: #27ae60;
        }

        .requirement-item.invalid {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <span class="icon">💡</span>
            <h1>Create Account</h1>
            <p>Join Smart Lighting Control System</p>
        </div>

        <form method="POST" action="/signup" id="signupForm">
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password">
                <div class="password-requirement" id="passwordReq">
                    <div class="requirement-item" id="req-length">At least 6 characters</div>
                    <div class="requirement-item" id="req-uppercase">At least one uppercase letter</div>
                    <div class="requirement-item" id="req-number">At least one number</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required autocomplete="new-password">
            </div>

            <button type="submit" class="signup-btn">Create Account</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="/login">Sign In Here</a></p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const passwordReq = document.getElementById('passwordReq');

        // Password requirement validation
        const requirements = {
            length: (val) => val.length >= 6,
            uppercase: (val) => /[A-Z]/.test(val),
            number: (val) => /\d/.test(val)
        };

        passwordInput.addEventListener('input', function() {
            if (this.value) {
                passwordReq.classList.add('show');
            } else {
                passwordReq.classList.remove('show');
            }

            // Check each requirement
            const lengthValid = requirements.length(this.value);
            const uppercaseValid = requirements.uppercase(this.value);
            const numberValid = requirements.number(this.value);

            updateRequirement('req-length', lengthValid);
            updateRequirement('req-uppercase', uppercaseValid);
            updateRequirement('req-number', numberValid);
        });

        function updateRequirement(id, valid) {
            const elem = document.getElementById(id);
            if (valid) {
                elem.classList.remove('invalid');
                elem.classList.add('valid');
            } else {
                elem.classList.remove('valid');
                elem.classList.add('invalid');
            }
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorMsg.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (!username) {
                errorMsg.textContent = 'Username is required.';
                errorMsg.classList.add('show');
                return;
            }

            if (username.length < 3) {
                errorMsg.textContent = 'Username must be at least 3 characters.';
                errorMsg.classList.add('show');
                return;
            }

            if (!email) {
                errorMsg.textContent = 'Email is required.';
                errorMsg.classList.add('show');
                return;
            }

            if (!requirements.length(password) || !requirements.uppercase(password) || !requirements.number(password)) {
                errorMsg.textContent = 'Password must be at least 6 characters with uppercase and number.';
                errorMsg.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.classList.add('show');
                return;
            }

            // Submit form
            this.submit();
        });

        // Check for error parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const errorType = urlParams.get('error');
            const errorMsg = document.getElementById('errorMsg');
            if (errorType === 'exists') {
                errorMsg.textContent = 'Username or email already exists. Please choose another.';
            } else if (errorType === 'invalid') {
                errorMsg.textContent = 'Invalid input. Please check your details.';
            } else {
                errorMsg.textContent = 'An error occurred. Please try again.';
            }
            errorMsg.classList.add('show');
        }

        if (urlParams.has('success')) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = 'Account created successfully! Redirecting to login...';
            successMsg.classList.add('show');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        }
    </script>
</body>
</html>
